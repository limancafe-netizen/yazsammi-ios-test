appId: com.yazsammi.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Test girişi"
    timeout: 60000
- takeScreenshot: 01_giris
- runFlow:
    when:
      visible: "Reddet"
    commands:
      - takeScreenshot: 01b_olcum_bandi
      - tapOn: "Reddet"
- tapOn: "Test girişi"
- takeScreenshot: 01c_test_form
- tapOn: "test adı"
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- inputText: "iosdenetim25"
- tapOn:
    text: "Hesabınla devam et"
    optional: true
- tapOn: "Gir"
- extendedWaitUntil:
    notVisible: "Hesabınla devam et"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*"
    timeout: 15000
- takeScreenshot: 02_giris_sonrasi
- runFlow:
    when:
      visible: "Haber ver"
    commands:
      - takeScreenshot: 03_bildirim_aciklama
      - tapOn: "Haber ver"
      - runFlow:
          when:
            visible: "Allow|İzin Ver|İzin ver"
          commands:
            - takeScreenshot: 04_sistem_izni
            - tapOn: "Allow|İzin Ver|İzin ver"
- takeScreenshot: 05_ana_ekran
- runFlow:
    when:
      visible: "Kabul.*|Tamam"
    commands:
      - takeScreenshot: 06_olcum_bandi
      - tapOn: "Kabul.*|Tamam"
